# Tests on every push and pull request: the Rust app, the firmware's host tests (its C++
# engines compiled on the runner), and the firmware build. No clock or network device needed.
# (The retired Python app in legacy/python-app/ is no longer tested here.)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust app (wfd-app)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wfd-app
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wfd-app
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  firmware-host:
    name: Firmware host tests (wfd-firmware/tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wfd-firmware/tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Test
        run: uv run --with-requirements requirements.txt pytest -ra

  firmware:
    name: Firmware build (wfd-firmware)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wfd-firmware/clock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('wfd-firmware/clock/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Embedded pages are up to date
        # embed_web.py regenerates src/web_pages.h from web/*.html before every build
        run: git diff --exit-code -- src/web_pages.h || (echo "::error::src/web_pages.h is stale - run pio run (or python embed_web.py) and commit it" && exit 1)
      - name: Size
        run: ls -l .pio/build/wfd/firmware.bin
