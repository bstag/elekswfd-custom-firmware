<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFD Control</title>
<style>
  :root { --bg:#0e1013; --panel:#161a1f; --panel2:#1d2228; --line:#2a3038; --text:#e6e9ee;
          --muted:#8b95a3; --accent:#72d3ff; --accent-dim:#1f4a5c; --ok:#3ccf7f; --bad:#ff5d5d; --off:#2b3036; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 20px;
           border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:2; }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--bad); display:inline-block; margin-right:6px; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  main { max-width:900px; margin:0 auto; padding:20px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin:0 0 14px; font-weight:600;
       display:flex; align-items:center; gap:10px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:10px 0; }
  label { color:var(--muted); font-size:13px; }
  input[type=text], select { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:7px; padding:7px 10px; font:inherit; }
  input[type=range] { accent-color:var(--accent); flex:1; min-width:120px; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px;
    padding:7px 12px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#06212c; border-color:var(--accent); font-weight:600; }
  .switch { position:relative; width:42px; height:24px; flex:0 0 auto; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--off); border-radius:24px; transition:.2s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff;
    border-radius:50%; transition:.2s; }
  .switch input:checked + .slider { background:var(--accent-dim); }
  .switch input:checked + .slider:before { transform:translateX(18px); background:var(--accent); }
  .styles { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .styles button { padding:8px 4px; font-size:12px; }
  .styles button.sel { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  .meter { height:14px; background:var(--panel2); border-radius:4px; overflow:hidden; flex:1; min-width:100px; }
  .meter div { height:100%; width:0; background:var(--accent); transition:width .1s; }
  .stat { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .stat b { width:42px; color:var(--muted); font-size:12px; }
  .stat span { width:40px; text-align:right; font-variant-numeric:tabular-nums; }
  .big { font-size:22px; font-weight:600; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .wx { font-size:30px; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>WFD Control</h1>
  <span><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
  <span id="clock" class="big"></span>
</header>
<main>
  <section>
    <h2>Clock</h2>
    <div class="row">
      <label class="switch"><input type="checkbox" id="time_sync"><span class="slider"></span></label>
      <label for="time_sync">Keep time synced to this PC (DST-aware)</label>
    </div>
    <div class="row">
      <button id="syncNow">Sync time now</button>
      <span class="hint" id="timeInfo"></span>
    </div>
    <div class="row">
      <label>Brightness</label>
      <input type="range" id="brightness" min="1" max="16">
      <span id="brightVal"></span>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="clock_24h"><span class="slider"></span></label>
      <label for="clock_24h">24-hour clock <span class="hint">(off = 12-hour)</span></label>
    </div>
  </section>

  <section>
    <h2>Spectrum</h2>
    <div class="row">
      <label class="switch"><input type="checkbox" id="spectrum"><span class="slider"></span></label>
      <label for="spectrum">Show audio spectrum</label>
    </div>
    <label>Style</label>
    <div class="styles" id="styles">
      <button data-s="1">Bars ↑</button><button data-s="2">Bars ↓</button>
      <button data-s="3">Center</button><button data-s="4">Peak dot</button><button data-s="5">Bars+dot</button>
    </div>
    <div class="stat"><b>Audio</b><div class="meter"><div id="mOut"></div></div><span id="vOut">0</span></div>
    <div class="stat"><b>Mic</b><div class="meter"><div id="mMic"></div></div><span id="vMic">0</span></div>
    <div class="row"><label>Audio gain</label><input type="range" id="gain_out" min="0.2" max="4" step="0.1"></div>
    <div class="row"><label>Mic gain</label><input type="range" id="gain_mic" min="0.2" max="4" step="0.1"></div>
    <p class="hint" id="audioInfo"></p>
  </section>

  <section>
    <h2>System bars</h2>
    <div class="row">
      <label class="switch"><input type="checkbox" id="bars"><span class="slider"></span></label>
      <label for="bars">Show CPU / GPU / RAM</label>
    </div>
    <div class="stat"><b>CPU</b><div class="meter"><div id="mCpu"></div></div><span id="vCpu">0%</span></div>
    <div class="stat"><b>GPU</b><div class="meter"><div id="mGpu"></div></div><span id="vGpu">0%</span></div>
    <div class="stat"><b>RAM</b><div class="meter"><div id="mRam"></div></div><span id="vRam">0%</span></div>
  </section>

  <section>
    <h2>Weather</h2>
    <div class="row">
      <label class="switch"><input type="checkbox" id="weather"><span class="slider"></span></label>
      <label for="weather">Show weather</label>
    </div>
    <div class="row">
      <span class="wx" id="wxTemp">–</span>
      <span id="wxCond" class="big"></span>
    </div>
    <div class="row">
      <label>Location</label>
      <input type="text" id="location" placeholder="ZIP or Town, State" style="flex:1">
      <select id="units"><option value="fahrenheit">°F</option><option value="celsius">°C</option></select>
      <button class="primary" id="applyLoc">Apply</button>
    </div>
    <p class="hint" id="wxInfo"></p>
  </section>

  <section>
    <h2>Message line</h2>
    <label>What the 6 message characters show</label>
    <div class="styles" id="msgMode" style="grid-template-columns:repeat(5,1fr); margin-bottom:10px">
      <button data-m="weather">Weather</button>
      <button data-m="window">Window</button>
      <button data-m="text">Text</button>
      <button data-m="date">Date</button>
      <button data-m="rotate">Rotate</button>
    </div>
    <div class="row">
      <input type="text" id="custom_text" placeholder="Custom text — use {date} {time} {time12} {day}" style="flex:1">
      <button class="primary" id="applyText">Set</button>
    </div>
    <div class="row" id="rotateRow">
      <label>Rotate through:</label>
      <label><input type="checkbox" id="rotate_weather"> Weather</label>
      <label><input type="checkbox" id="rotate_window"> Window</label>
      <label><input type="checkbox" id="rotate_text"> Text</label>
      <label><input type="checkbox" id="rotate_date"> Date</label>
      <label>· every</label><input type="text" id="rotate_dwell" style="width:46px"> s
    </div>
    <div class="row" style="border-top:1px solid var(--line); padding-top:12px">
      <label>Offline message</label>
      <input type="text" id="offline_text" placeholder="shown on the clock when the app is off" style="flex:1">
      <button class="primary" id="omSave">Save to clock</button>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="msg_standalone"><span class="slider"></span></label>
      <label for="msg_standalone">Show offline message when app is off</label>
    </div>
    <p class="hint" id="msgInfo"></p>
  </section>

  <section>
    <h2>Grid (7×7 motion)</h2>
    <div class="row">
      <label class="switch"><input type="checkbox" id="grid_enable"><span class="slider"></span></label>
      <label for="grid_enable">Animate the grid</label>
    </div>
    <div class="row">
      <label>Animation</label>
      <select id="grid_anim">
        <option value="spin">Spin</option><option value="bounce">Bounce</option>
        <option value="rain">Rain</option><option value="wave">Wave</option>
        <option value="pulse">Pulse</option><option value="sparkle">Sparkle</option>
        <option value="scan">Scan</option><option value="life">Life</option>
        <option value="audio">Audio bars</option><option value="cpu">CPU load</option>
        <option value="mouth">Mouth (sound)</option><option value="heart">Heartbeat</option>
        <option value="custom">Custom (drawn)</option>
      </select>
    </div>
    <div class="row"><label>Speed</label><input type="range" id="grid_fps" min="3" max="25"><span id="fpsVal"></span></div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="grid_frame"><span class="slider"></span></label>
      <label for="grid_frame">Light the border frame</label>
      <span style="flex:1"></span>
      <a href="/draw" style="color:var(--accent); text-decoration:none">✎ Open grid animator →</a>
    </div>
    <div class="row">
      <button class="primary" id="gridSave">Save to clock</button>
      <label class="switch"><input type="checkbox" id="grid_standalone"><span class="slider"></span></label>
      <label for="grid_standalone">Play when app is off</label>
      <span class="hint" id="savedInfo"></span>
    </div>
    <p class="hint" id="gridSaveHint"></p>
  </section>

  <section>
    <h2>Top row (icons &amp; logo)</h2>
    <label>Status icons</label>
    <div class="styles" id="iconMode" style="grid-template-columns:repeat(4,1fr); margin:8px 0 10px">
      <button data-i="off">Off</button>
      <button data-i="audio">Audio</button>
      <button data-i="system">System</button>
      <button data-i="all">All on</button>
    </div>
    <div class="row">
      <label class="switch"><input type="checkbox" id="logo"><span class="slider"></span></label>
      <label for="logo">ELEKSMAKER logo</label>
    </div>
    <p class="hint" id="iconHint"></p>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
let cfg = {}, suppress = false;

async function post(body) {
  await fetch('/api/set', { method:'POST', headers:{'Content-Type':'application/json','X-WFD':'1'}, body: JSON.stringify(body) });
}
function setCfg(patch) { Object.assign(cfg, patch); post(patch); }

async function poll() {
  let d;
  try { d = await (await fetch('/api/status')).json(); }
  catch { $('#dot').classList.remove('on'); $('#conn').textContent = 'app offline'; return; }
  const { state, config } = d;
  $('#dot').classList.toggle('on', state.connected);
  $('#conn').textContent = state.connected ? 'clock connected · ' + state.port : 'clock not found';
  $('#clock').textContent = state.time || '';
  // meters
  $('#mOut').style.width = (state.levels.out / 12 * 100) + '%'; $('#vOut').textContent = state.levels.out;
  $('#mMic').style.width = (state.levels.mic / 12 * 100) + '%'; $('#vMic').textContent = state.levels.mic;
  const m = state.metrics;
  for (const k of ['cpu','gpu','ram']) { $('#m'+k[0].toUpperCase()+k.slice(1)).style.width = m[k]+'%'; $('#v'+k[0].toUpperCase()+k.slice(1)).textContent = m[k]+'%'; }
  $('#audioInfo').textContent = `out: ${state.audio.out || '—'}   ·   mic: ${state.audio.mic || '—'}`;
  const w = state.weather;
  $('#wxTemp').textContent = w.temp + '°' + (w.unit ? 'C' : 'F');
  $('#wxCond').textContent = w.cond || '';
  $('#wxInfo').textContent = w.label ? ('location: ' + w.label) : '';
  $('#msgInfo').textContent = (config.message_mode === 'weather') ? 'showing temperature'
    : ('showing: ' + (state.message || '—'));
  if (state.saved) $('#savedInfo').textContent = 'saved to clock (' + state.saved + ')';
  // reflect config into controls (unless the user is editing)
  if (!suppress) applyConfig(config);
}

function applyConfig(c) {
  cfg = c;
  for (const id of ['time_sync','clock_24h','spectrum','bars','weather']) $('#'+id).checked = !!c[id];
  $('#brightness').value = c.brightness; $('#brightVal').textContent = c.brightness;
  $('#gain_out').value = c.gain_out; $('#gain_mic').value = c.gain_mic;
  if ($('#location') !== document.activeElement) $('#location').value = c.location;
  $('#units').value = c.units;
  [...$('#styles').children].forEach(b => b.classList.toggle('sel', +b.dataset.s === c.style));
  [...$('#msgMode').children].forEach(b => b.classList.toggle('sel', b.dataset.m === c.message_mode));
  if ($('#custom_text') !== document.activeElement) $('#custom_text').value = c.custom_text;
  for (const k of ['rotate_weather','rotate_window','rotate_text','rotate_date']) $('#'+k).checked = !!c[k];
  if ($('#rotate_dwell') !== document.activeElement) $('#rotate_dwell').value = c.rotate_dwell;
  $('#rotateRow').style.display = c.message_mode === 'rotate' ? 'flex' : 'none';
  $('#grid_enable').checked = !!c.grid_enable;
  $('#grid_frame').checked = !!c.grid_frame;
  $('#grid_anim').value = c.grid_anim;
  $('#grid_fps').value = c.grid_fps; $('#fpsVal').textContent = c.grid_fps;
  $('#grid_standalone').checked = !!c.grid_standalone;
  $('#msg_standalone').checked = !!c.msg_standalone;
  if ($('#offline_text') !== document.activeElement) $('#offline_text').value = c.offline_text;
  const repeatable = ['spin','bounce','rain','wave','pulse','sparkle','scan','life','heart','custom'].includes(c.grid_anim);
  $('#gridSave').disabled = !repeatable;
  $('#gridSaveHint').textContent = repeatable ? '' : `“${c.grid_anim}” needs the PC (live data) — it can't play standalone.`;
  [...$('#iconMode').children].forEach(b => b.classList.toggle('sel', b.dataset.i === c.icon_mode));
  $('#logo').checked = !!c.logo;
  const ih = { off:'Icons off.', all:'All icons lit (decorative).',
    audio:'Audio icons act as an output meter (speaker→headphones→vinyl→mixer); mic lights with mic input.',
    system:'tower=CPU busy · monitor=GPU busy · server=RAM high · wifi=online · clock=ticks · battery=low' };
  $('#iconHint').textContent = ih[c.icon_mode] || '';
}

for (const id of ['time_sync','clock_24h','spectrum','bars','weather'])
  $('#'+id).onchange = e => setCfg({ [id]: e.target.checked });
$('#brightness').oninput = e => { $('#brightVal').textContent = e.target.value; setCfg({ brightness: +e.target.value }); };
$('#gain_out').onchange = e => setCfg({ gain_out: +e.target.value });
$('#gain_mic').onchange = e => setCfg({ gain_mic: +e.target.value });
$('#styles').onclick = e => { if (e.target.dataset.s) setCfg({ style: +e.target.dataset.s }), applyConfig(cfg); };
$('#syncNow').onclick = () => fetch('/api/sync', { method:'POST', headers:{'Content-Type':'application/json','X-WFD':'1'}, body:'{}' });
$('#applyLoc').onclick = () => setCfg({ location: $('#location').value.trim(), units: $('#units').value });
$('#location').onfocus = () => suppress = true;
$('#location').onblur = () => suppress = false;
$('#msgMode').onclick = e => { if (e.target.dataset.m) { setCfg({ message_mode: e.target.dataset.m }); applyConfig(cfg); } };
$('#applyText').onclick = () => setCfg({ custom_text: $('#custom_text').value, message_mode: 'text' });
$('#custom_text').onfocus = () => suppress = true;
$('#custom_text').onblur = () => suppress = false;
for (const k of ['rotate_weather','rotate_window','rotate_text','rotate_date'])
  $('#'+k).onchange = e => setCfg({ [k]: e.target.checked });
$('#rotate_dwell').onchange = e => setCfg({ rotate_dwell: Math.max(2, +e.target.value || 8) });
$('#grid_enable').onchange = e => setCfg({ grid_enable: e.target.checked });
$('#grid_frame').onchange = e => setCfg({ grid_frame: e.target.checked });
$('#grid_anim').onchange = e => setCfg({ grid_anim: e.target.value });
$('#grid_fps').oninput = e => { $('#fpsVal').textContent = e.target.value; setCfg({ grid_fps: +e.target.value }); };
$('#grid_standalone').onchange = e => setCfg({ grid_standalone: e.target.checked });
$('#msg_standalone').onchange = e => setCfg({ msg_standalone: e.target.checked });
$('#offline_text').onfocus = () => suppress = true;
$('#offline_text').onblur = () => suppress = false;
async function apiPost(path, body) { return (await fetch(path, { method:'POST', headers:{'Content-Type':'application/json','X-WFD':'1'}, body: JSON.stringify(body||{}) })).json(); }
$('#gridSave').onclick = async () => { const r = await apiPost('/api/grid_save', {}); $('#gridSave').textContent = r.error ? 'Error' : '✓ Saved'; setTimeout(() => $('#gridSave').textContent = 'Save to clock', 1500); };
$('#iconMode').onclick = e => { if (e.target.dataset.i) { setCfg({ icon_mode: e.target.dataset.i }); applyConfig(cfg); } };
$('#logo').onchange = e => setCfg({ logo: e.target.checked });
$('#omSave').onclick = async () => { setCfg({ offline_text: $('#offline_text').value }); const r = await apiPost('/api/om_save', { text: $('#offline_text').value }); $('#omSave').textContent = r.error ? 'Error' : '✓ Saved'; setTimeout(() => $('#omSave').textContent = 'Save to clock', 1500); };

poll(); setInterval(poll, 1000);
</script>
</body>
</html>
