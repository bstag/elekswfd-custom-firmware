<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WFD Grid Animator</title>
<style>
  :root { --bg:#0e1013; --panel:#161a1f; --panel2:#1d2228; --line:#2a3038; --text:#e6e9ee;
          --muted:#8b95a3; --accent:#72d3ff; --accent-dim:#1f4a5c; --off:#1b1f24; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 18px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  h1 { font-size:16px; margin:0 auto 0 0; }
  a { color:var(--accent); text-decoration:none; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:7px;
    padding:7px 11px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#06212c; border-color:var(--accent); font-weight:600; }
  button.on { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
  label { color:var(--muted); font-size:13px; }
  main { display:flex; gap:28px; padding:20px; flex-wrap:wrap; align-items:flex-start; }
  .grid { display:grid; grid-template-columns:repeat(7,44px); gap:5px; padding:14px; background:#000;
    border-radius:12px; user-select:none; touch-action:none; width:max-content; }
  .grid.framed { outline:4px solid var(--accent); outline-offset:3px; }
  .grid div { width:44px; height:44px; border-radius:50%; background:var(--off); cursor:pointer; }
  .grid div.on { background:var(--accent); box-shadow:0 0 10px var(--accent); }
  .tools { display:grid; grid-template-columns:repeat(4,auto); gap:6px; margin-top:12px; width:max-content; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0; }
  .strip { display:flex; gap:6px; overflow-x:auto; padding:6px 2px; max-width:520px; }
  .thumb { flex:0 0 auto; display:grid; grid-template-columns:repeat(7,6px); gap:1px; padding:5px;
    background:#000; border:2px solid transparent; border-radius:6px; cursor:pointer; position:relative; }
  .thumb i { width:6px; height:6px; background:#20252b; border-radius:1px; }
  .thumb i.on { background:var(--accent); }
  .thumb.sel { border-color:var(--accent); }
  .thumb em { position:absolute; bottom:-2px; right:3px; font-size:9px; color:var(--muted); font-style:normal; }
  input[type=range] { accent-color:var(--accent); }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>WFD Grid Animator</h1>
  <button id="frame" class="on">Border frame</button>
  <label>Speed</label><input type="range" id="fps" min="2" max="20" value="8"><span id="fpsVal">8</span>
  <button id="preview" class="on">Live preview</button>
  <button class="primary" id="play">▶ Play on clock</button>
  <button id="saveClock">⭳ Save to clock (standalone)</button>
  <a href="/">← Back to Control</a>
</header>
<main>
  <div>
    <div class="grid" id="grid"></div>
    <div class="tools">
      <button data-t="clear">Clear</button><button data-t="fill">Fill</button>
      <button data-t="invert">Invert</button><button data-t="mirror">Mirror</button>
      <button data-t="up">↑</button><button data-t="down">↓</button>
      <button data-t="left">←</button><button data-t="right">→</button>
    </div>
  </div>
  <div style="flex:1; min-width:300px">
    <div class="row">
      <button id="fAdd">+ Frame</button><button id="fDup">Duplicate</button>
      <button id="fCopyPrev">Copy prev</button><button id="fDel">Delete</button>
      <span id="fCount" class="hint"></span>
    </div>
    <div class="strip" id="strip"></div>
    <div class="row">
      <button id="playLocal" class="on">▶ Preview animation here</button>
      <button id="save">Save .json</button><button id="load">Open .json</button>
      <input type="file" id="file" accept=".json" hidden>
    </div>
    <p class="hint">Click/drag the grid to draw. Each frame is one step of the animation. "Play on clock" stores it as the
      <b>Custom</b> grid animation and starts it. Live preview mirrors the current frame onto the clock as you draw.</p>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const NS = 7;
let frames = [Array(7).fill(0)], cur = 0, frameOn = true, previewOn = true, localTimer = null;

const gridEl = $('#grid');
for (let i = 0; i < 49; i++) { const d = document.createElement('div'); d.dataset.i = i; gridEl.appendChild(d); }

function getBit(f, r, c) { return (f[r] >> c) & 1; }
function setBit(r, c, v) { const f = frames[cur]; f[r] = v ? (f[r] | (1 << c)) : (f[r] & ~(1 << c)); }

let painting = null;
gridEl.addEventListener('pointerdown', e => {
  const i = e.target.dataset.i; if (i === undefined) return;
  const r = (i / 7) | 0, c = i % 7;
  painting = getBit(frames[cur], r, c) ? 0 : 1;
  setBit(r, c, painting); changed(); gridEl.setPointerCapture(e.pointerId);
});
gridEl.addEventListener('pointermove', e => {
  if (painting === null) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  if (el && el.parentNode === gridEl) { const i = +el.dataset.i; setBit((i / 7) | 0, i % 7, painting); changed(); }
});
addEventListener('pointerup', () => painting = null);

function renderGrid() {
  [...gridEl.children].forEach((d, i) => d.classList.toggle('on', !!getBit(frames[cur], (i / 7) | 0, i % 7)));
  gridEl.classList.toggle('framed', frameOn);
}
function renderThumb(idx) {
  const t = $('#strip').children[idx]; if (!t) return;
  [...t.querySelectorAll('i')].forEach((d, i) => d.classList.toggle('on', !!getBit(frames[idx], (i / 7) | 0, i % 7)));
  t.querySelector('em').textContent = idx + 1;
  t.classList.toggle('sel', idx === cur);
}
function renderStrip() {
  const s = $('#strip'); s.innerHTML = '';
  frames.forEach((_, idx) => {
    const t = document.createElement('div'); t.className = 'thumb';
    for (let i = 0; i < 49; i++) t.appendChild(document.createElement('i'));
    const em = document.createElement('em'); t.appendChild(em);
    t.onclick = () => { cur = idx; render(); };
    s.appendChild(t); renderThumb(idx);
  });
  $('#fCount').textContent = `frame ${cur + 1} / ${frames.length}`;
}
function render() { renderGrid(); renderStrip(); }
function changed() { renderGrid(); renderThumb(cur); pushPreview(); }

async function pushPreview() {
  if (!previewOn) return;
  fetch('/api/grid_preview', { method:'POST', headers:{'Content-Type':'application/json','X-WFD':'1'},
    body: JSON.stringify({ rows: frames[cur], frame: frameOn ? 1 : 0 }) });
}

const T = {
  clear: f => f.map(() => 0), fill: f => f.map(() => 0x7F), invert: f => f.map(v => ~v & 0x7F),
  mirror: f => f.map(v => { let o = 0; for (let c = 0; c < 7; c++) if (v & (1 << c)) o |= 1 << (6 - c); return o; }),
  up: f => f.map((_, r) => r < 6 ? f[r + 1] : 0), down: f => f.map((_, r) => r > 0 ? f[r - 1] : 0),
  left: f => f.map(v => (v >> 1) & 0x7F), right: f => f.map(v => (v << 1) & 0x7F),
};
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { frames[cur] = T[b.dataset.t](frames[cur]); changed(); });

$('#fAdd').onclick = () => { frames.splice(cur + 1, 0, Array(7).fill(0)); cur++; render(); changed(); };
$('#fDup').onclick = () => { frames.splice(cur + 1, 0, [...frames[cur]]); cur++; render(); changed(); };
$('#fCopyPrev').onclick = () => { if (cur > 0) { frames[cur] = [...frames[cur - 1]]; changed(); } };
$('#fDel').onclick = () => { if (frames.length > 1) { frames.splice(cur, 1); cur = Math.min(cur, frames.length - 1); } else frames[0] = Array(7).fill(0); render(); changed(); };

$('#frame').onclick = () => { frameOn = !frameOn; $('#frame').classList.toggle('on', frameOn); changed(); };
$('#preview').onclick = () => { previewOn = !previewOn; $('#preview').classList.toggle('on', previewOn); if (previewOn) pushPreview(); };
$('#fps').oninput = () => $('#fpsVal').textContent = $('#fps').value;

function stopLocal() { clearInterval(localTimer); localTimer = null; $('#playLocal').classList.remove('on'); $('#playLocal').textContent = '▶ Preview animation here'; }
$('#playLocal').onclick = () => {
  if (localTimer) return stopLocal();
  $('#playLocal').classList.add('on'); $('#playLocal').textContent = '■ Stop';
  localTimer = setInterval(() => { cur = (cur + 1) % frames.length; render(); pushPreview(); }, 1000 / +$('#fps').value);
};

$('#play').onclick = async () => {
  await fetch('/api/set', { method:'POST', headers:{'Content-Type':'application/json','X-WFD':'1'},
    body: JSON.stringify({ grid_custom: frames, grid_anim: 'custom', grid_enable: true,
      grid_frame: frameOn, grid_fps: +$('#fps').value }) });
  $('#play').textContent = '✓ Playing on clock'; setTimeout(() => $('#play').textContent = '▶ Play on clock', 1500);
};

$('#saveClock').onclick = async () => {
  const r = await (await fetch('/api/grid_save', { method:'POST', headers:{'Content-Type':'application/json','X-WFD':'1'},
    body: JSON.stringify({ frames, fps: +$('#fps').value, frame: frameOn }) })).json();
  $('#saveClock').textContent = r.error ? 'Error' : '✓ Saved to clock';
  setTimeout(() => $('#saveClock').textContent = '⭳ Save to clock (standalone)', 1800);
};

$('#save').onclick = () => {
  const blob = new Blob([JSON.stringify({ frames, frame: frameOn, fps: +$('#fps').value })], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'wfd_animation.json'; a.click();
};
$('#load').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const d = JSON.parse(await f.text());
  frames = d.frames.map(fr => fr.slice(0, 7)); cur = 0;
  if (typeof d.frame === 'boolean') { frameOn = d.frame; $('#frame').classList.toggle('on', frameOn); }
  if (d.fps) { $('#fps').value = d.fps; $('#fpsVal').textContent = d.fps; }
  render(); changed(); e.target.value = '';
};

render(); changed();
</script>
</body>
</html>
