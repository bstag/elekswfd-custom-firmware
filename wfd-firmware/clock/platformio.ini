; WFD clock firmware (our own). Build: pio run   Flash (USB 2.0 port): pio run -t upload
[env:wfd]
platform = espressif32@7.1.3   ; pinned: an unpinned platform changes the build with every PlatformIO update
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions_wfd.csv
lib_deps = bblanchon/ArduinoJson@7.2.1
extra_scripts = pre:embed_web.py
